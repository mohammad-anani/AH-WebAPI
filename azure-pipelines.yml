# Docker + .NET 8 + Azure DevOps Pipeline
# Build, Test, Push Docker image, Deploy to Kubernetes

trigger:
  - dev

resources:
  - repo: self

variables:
  dockerRegistryServiceConnection: "e114edaa-2c81-40ba-926f-d412f9af95e7"
  imageRepository: "aspnet-ah"
  containerRegistry: "ahappregistry.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "$(Build.BuildId)"

  vmImageName: "ubuntu-latest"
  windowsImageName: "windows-latest"

  aksServiceConnectionName: "dev-AHAKSCluster-dev-1759080360257"
  deploymentFile: "$(Build.SourcesDirectory)/k8s/deployment.yaml"

  resourceGroupServiceConnectionName: "ah-resource-group-connection"
  keyVaultName: "aspnet-pipeline-kv"

stages:
  - stage: InitializeKeyVault
    displayName: Initialize Key Vault Secrets
    jobs:
      - job: FetchSecrets
        displayName: Fetch Secrets
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureKeyVault@2
            displayName: Fetch key vault secrets
            inputs:
              azureSubscription: $(resourceGroupServiceConnectionName)
              keyVaultName: $(keyVaultName)
              SecretsFilter: "*"
              RunAsPreJob: true

  - stage: Test
    displayName: Run Tests
    dependsOn: InitializeKeyVault
    jobs:
      - job: RunTests
        displayName: Run Tests
        pool:
          vmImage: "$(windowsImageName)"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: "sdk"
              version: "8.0.x"

          - task: DotNetCoreCLI@2
            displayName: Restore NuGet Packages
            inputs:
              command: "restore"
              projects: "**/*.sln"

          - task: DotNetCoreCLI@2
            displayName: Build Solution
            inputs:
              command: "build"
              projects: "**/*.sln"
              arguments: "--configuration Debug --no-restore --verbosity minimal"

          # Debug: ensure test DLL exists
          - script: dir AH.Tests\bin\Debug\net8.0
            displayName: Verify test DLL exists

          - task: DotNetCoreCLI@2
            displayName: Run Tests
            inputs:
              command: "test"
              projects: "AH.Tests\\AH.Tests.csproj"
              arguments: '--configuration Debug --no-build --framework net8.0 --logger "console;verbosity=detailed"'
              publishTestResults: true
              failOnFailedTests: false

          - task: PublishTestResults@2
            displayName: Publish Test Results
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "**/*.trx"
              mergeTestResults: true

  - stage: Build
    displayName: Build and Push Docker Image
    dependsOn: Test
    jobs:
      - job: BuildDocker
        displayName: Build Docker Image
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and Push Docker Image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(Build.SourcesDirectory)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: $(tag)
              arguments: "--build-arg ASPNETCORE_ENVIRONMENT=Production"

  - stage: DeployToDev
    displayName: Deploy to Dev
    dependsOn: Build
    condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeploymentToDev
        displayName: Deployment to Dev Environment
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    echo "Listing k8s directory contents"
                    ls -l $(Build.SourcesDirectory)/k8s/
                  displayName: List Files in k8s Directory

                - script: |
                    sed -i 's/__TAG__/$(tag)/g' $(deploymentFile)
                  displayName: Replace Image Tag in Deployment YAML

                - task: Kubernetes@1
                  displayName: Deploy to Dev Namespace
                  inputs:
                    kubernetesServiceEndpoint: $(aksServiceConnectionName)
                    namespace: dev
                    command: apply
                    arguments: "-f $(Build.SourcesDirectory)/k8s/."
